limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
upstream django { server web:8000; }
server {
  listen 80;
  client_max_body_size 10m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'" always;
  location /static/ { proxy_set_header Host $host; proxy_pass http://django; expires 30d; }
  location /media/ { alias /app/media/; expires 7d; }
  location / { limit_req zone=api burst=40 nodelay; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_pass http://django; }
}
